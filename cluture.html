<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>해남 문화달력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  --perf: #C14B22; --perf-bg: #FDF0EB; --perf-lt: #FBDDD0;
  --trad: #4A3A9A; --trad-bg: #F0EEFF; --trad-lt: #DDD8FF;
  --exhi: #1558A0; --exhi-bg: #EAF2FF; --exhi-lt: #C8DEFF;
  --edu:  #2A6B1A; --edu-bg:  #EDFBE8; --edu-lt:  #C5F0BB;
  --fest: #8A5200; --fest-bg: #FFF7E6; --fest-lt: #FFE4A0;
  --evt:  #4A3A9A; --evt-bg:  #F0EEFF; --evt-lt:  #DDD8FF;
  --accent: #1A6B3C;
  --bg: #F7F6F2;
  --card: #FFFFFF;
  --border: rgba(0,0,0,0.08);
  --text: #1A1A18;
  --muted: #6B6B65;
  --hint: #A0A09A;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
}

/* ── 상단바 ── */
.top-bar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 10px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.logo {
  font-family: 'Noto Serif KR', serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: -0.3px;
}
.logo span { color: var(--text); font-size: 13px; font-family: 'Noto Sans KR', sans-serif; font-weight: 400; margin-left: 6px; }
.top-actions { display: flex; gap: 14px; align-items: center; }
.icon-btn {
  background: none; border: none; cursor: pointer;
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); transition: background .15s;
  font-size: 18px; position: relative;
}
.icon-btn:hover { background: var(--bg); }
.badge {
  position: absolute; top: 4px; right: 4px;
  width: 8px; height: 8px; border-radius: 50%;
  background: #E53535; border: 1.5px solid white;
}

/* ── 뷰 탭 ── */
.view-tabs {
  display: flex; gap: 4px;
  background: var(--bg);
  border-radius: 10px;
  padding: 3px;
}
.vt {
  flex: 1; border: none; background: transparent;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; font-weight: 500;
  padding: 7px 4px; border-radius: 8px;
  color: var(--muted); cursor: pointer;
  transition: all .18s;
}
.vt.on {
  background: var(--card);
  color: var(--accent);
  box-shadow: 0 1px 4px rgba(0,0,0,0.10);
}

/* ── 날짜 스트립 ── */
.date-strip-wrap { padding: 12px 16px 0; }
.date-label { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.date-strip {
  display: flex; gap: 6px; overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.date-strip::-webkit-scrollbar { display: none; }
.db {
  flex-shrink: 0; width: 58px;
  display: flex; flex-direction: column; align-items: center;
  padding: 9px 6px 8px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--card);
  cursor: pointer;
  transition: all .15s;
}
.db:hover { border-color: var(--accent); }
.db.cur { border-color: var(--accent); background: #EDF7F0; }
.db.no-ev { opacity: .4; }
.db .dow { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
.db .num { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 5px; line-height: 1; }
.db.cur .num { color: var(--accent); }
.dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; min-height: 7px; }
.dot { width: 6px; height: 6px; border-radius: 50%; }

/* ── 섹션 헤더 ── */
.sec-hd {
  display: flex; justify-content: space-between;
  align-items: center;
  padding: 14px 16px 8px;
}
.sec-title { font-size: 14px; font-weight: 700; color: var(--text); }
.sec-count {
  font-size: 11px; padding: 3px 10px;
  border-radius: 20px;
  background: var(--edu-bg); color: var(--edu);
  font-weight: 500;
}

/* ── 이벤트 카드 ── */
.ev-list { padding: 0 12px; display: flex; flex-direction: column; gap: 8px; }
.ev-card {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 13px 14px;
  cursor: pointer;
  transition: border-color .15s, transform .1s;
  animation: fadeUp .25s ease both;
}
.ev-card:hover { border-color: rgba(0,0,0,0.16); transform: translateY(-1px); }
@keyframes fadeUp { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
.ev-card:nth-child(1) { animation-delay: 0s; }
.ev-card:nth-child(2) { animation-delay: .05s; }
.ev-card:nth-child(3) { animation-delay: .1s; }
.ev-card:nth-child(4) { animation-delay: .15s; }

.ev-top { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
.cat-tag {
  font-size: 10px; font-weight: 700;
  padding: 3px 8px; border-radius: 20px;
  letter-spacing: .3px;
}
.free-tag {
  font-size: 10px; font-weight: 500;
  padding: 3px 8px; border-radius: 20px;
  background: var(--edu-bg); color: var(--edu);
}
.hot-tag {
  font-size: 10px; font-weight: 500;
  padding: 3px 8px; border-radius: 20px;
  background: #FFF0EE; color: #C14B22;
  display: flex; align-items: center; gap: 3px;
}
.heart-btn {
  margin-left: auto;
  background: none; border: none; cursor: pointer;
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--hint); font-size: 18px;
  transition: all .15s;
}
.heart-btn:hover { background: #FFF0EE; color: #E04070; }
.heart-btn.on { color: #E04070; }
.heart-btn.on svg path { fill: #E04070; }

.ev-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; line-height: 1.35; }
.ev-meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; margin-bottom: 3px; line-height: 1.4; }
.ev-meta svg { flex-shrink: 0; }

.ev-bottom {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.saves-info { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
.saves-num { font-weight: 700; color: #E04070; }
.detail-btn {
  font-size: 12px; font-weight: 700;
  padding: 7px 14px; border-radius: 8px;
  border: none;
  background: var(--accent); color: #fff;
  cursor: pointer;
  transition: opacity .15s;
}
.detail-btn:hover { opacity: .88; }

/* ── 인기 탭 ── */
.hot-list { padding: 0 12px; display: flex; flex-direction: column; gap: 7px; }
.hot-item {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 12px 14px;
  display: flex; align-items: center; gap: 12px;
  animation: fadeUp .2s ease both;
  cursor: pointer;
  transition: border-color .15s;
}
.hot-item:hover { border-color: rgba(0,0,0,0.16); }
.hot-rank { font-size: 20px; font-weight: 700; min-width: 26px; color: var(--hint); font-variant-numeric: tabular-nums; }
.hot-rank.gold { color: #C8920A; }
.hot-rank.silver { color: #888884; }
.hot-rank.bronze { color: #A0622A; }
.hot-info { flex: 1; min-width: 0; }
.hot-name { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hot-sub { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.hot-saves { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: #E04070; white-space: nowrap; }

/* ── 주간 뷰 ── */
.week-body { padding: 0 12px; }
.week-day { margin-bottom: 12px; }
.week-dhd {
  font-size: 11px; font-weight: 700;
  color: var(--muted);
  padding: 6px 0 5px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 5px;
  display: flex; justify-content: space-between;
}
.week-dhd.today-hd { color: var(--accent); border-color: var(--edu-lt); }
.week-ev {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.week-ev:last-child { border-bottom: none; }
.wdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.winfo { flex: 1; min-width: 0; }
.wname { font-size: 12px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wmeta { font-size: 10px; color: var(--muted); }
.wsaves { font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 3px; white-space: nowrap; }
.wsaves span { color: #E04070; font-weight: 700; }
.wheart { background: none; border: none; cursor: pointer; color: var(--hint); font-size: 16px; padding: 4px; transition: color .15s; }
.wheart:hover, .wheart.on { color: #E04070; }

/* ── 월간 뷰 ── */
.month-body { padding: 0 12px; }
.cal-legend { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 0 10px; }
.ll { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--muted); }
.ldot { width: 8px; height: 8px; border-radius: 50%; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cdow { font-size: 10px; color: var(--muted); text-align: center; padding: 4px 0; font-weight: 500; }
.cc {
  min-height: 44px; border-radius: 8px;
  display: flex; flex-direction: column;
  align-items: center; padding: 5px 2px 4px;
  cursor: pointer; transition: background .12s;
}
.cc:hover { background: rgba(0,0,0,0.04); }
.cc.tod { background: #EDF7F0; }
.cc.emp { opacity: 0; pointer-events: none; }
.cnum { font-size: 12px; font-weight: 500; color: var(--text); }
.cc.tod .cnum { color: var(--accent); font-weight: 700; }
.cdots { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; margin-top: 3px; max-width: 22px; }
.cdot { width: 5px; height: 5px; border-radius: 50%; }

/* ── 상세 모달 ── */
.modal-backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
  max-width: 480px;
  margin: 0 auto;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--card);
  border-radius: 20px 20px 0 0;
  padding: 20px 20px 36px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  animation: slideUp .25s ease;
}
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
.modal-cat { display: flex; gap: 6px; margin-bottom: 10px; }
.modal-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 12px; line-height: 1.3; }
.modal-info-row {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 9px 0; border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.modal-info-row:last-of-type { border-bottom: none; }
.mi-label { color: var(--muted); min-width: 48px; flex-shrink: 0; }
.mi-val { color: var(--text); font-weight: 500; line-height: 1.5; }
.modal-desc {
  background: var(--bg); border-radius: 10px;
  padding: 12px; margin: 12px 0;
  font-size: 13px; color: var(--muted); line-height: 1.7;
}
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.m-call {
  flex: 1; padding: 13px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--card);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px; font-weight: 700;
  color: var(--text); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.m-save {
  flex: 2; padding: 13px;
  border-radius: 12px; border: none;
  background: var(--accent); color: #fff;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: opacity .15s;
}
.m-save:hover { opacity: .88; }
.m-save.saved { background: #E04070; }
.modal-saves {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--muted);
  margin-top: 10px; justify-content: center;
}
.modal-saves strong { color: #E04070; }
.modal-close {
  position: absolute; top: 16px; right: 16px;
  background: var(--bg); border: none;
  width: 32px; height: 32px; border-radius: 50%;
  font-size: 16px; cursor: pointer; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
}

/* ── 담은 것 패널 ── */
.saved-panel {
  display: none;
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 150;
  overflow-y: auto;
  max-width: 480px; margin: 0 auto;
  animation: slideIn .2s ease;
}
.saved-panel.open { display: block; }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
.saved-top {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 10;
}
.back-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; }
.saved-title { font-size: 17px; font-weight: 700; }
.saved-body { padding: 12px; }
.saved-empty {
  padding: 60px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}
.saved-ev {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 13px 14px;
  margin-bottom: 8px;
  display: flex; flex-direction: column; gap: 5px;
}
.saved-ev-top { display: flex; align-items: center; gap: 6px; }
.dday-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; margin-left: auto; }
.dday-today { background: #EDF7F0; color: var(--accent); }
.dday-soon { background: var(--edu-bg); color: var(--edu); }
.dday-past { background: var(--bg); color: var(--hint); }
.sev-name { font-size: 14px; font-weight: 700; color: var(--text); }
.sev-meta { font-size: 11px; color: var(--muted); }
.sev-bot { display: flex; gap: 7px; margin-top: 7px; }
.sev-call { flex: 1; padding: 8px; border-radius: 9px; border: 1px solid var(--border); background: var(--card); font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; text-align: center; }
.sev-remove { padding: 8px 12px; border-radius: 9px; border: none; background: var(--bg); font-size: 12px; color: var(--muted); cursor: pointer; }

/* ── 바텀 네비 ── */
.bottom-nav {
  position: sticky; bottom: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around;
  padding: 8px 0 max(env(safe-area-inset-bottom), 10px);
  z-index: 99;
}
.bn {
  display: flex; flex-direction: column;
  align-items: center; gap: 3px;
  font-size: 10px; color: var(--muted);
  border: none; background: none;
  cursor: pointer; padding: 4px 16px;
  border-radius: 12px; transition: color .15s;
  font-family: 'Noto Sans KR', sans-serif;
}
.bn.on { color: var(--accent); }
.bn svg { width: 22px; height: 22px; }

/* ── 빈 상태 ── */
.empty-state {
  padding: 48px 20px;
  text-align: center;
}
.empty-icon { font-size: 40px; margin-bottom: 10px; color: var(--hint); }
.empty-msg { font-size: 14px; color: var(--muted); line-height: 1.7; }
.nearby-btn {
  margin-top: 14px;
  padding: 10px 22px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--card);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; font-weight: 700;
  color: var(--text); cursor: pointer;
}

/* ── 토스트 ── */
.toast-wrap {
  position: fixed;
  bottom: 80px; left: 50%;
  transform: translateX(-50%);
  z-index: 999;
  pointer-events: none;
}
.toast-pill {
  background: #1A1A18;
  color: #F7F6F2;
  font-size: 12px; font-weight: 500;
  padding: 9px 18px;
  border-radius: 20px;
  white-space: nowrap;
  opacity: 0;
  transform: translateY(6px);
  transition: all .2s;
}
.toast-pill.show { opacity: 1; transform: translateY(0); }

/* ── 탭 섹션 ── */
.tab-sec { display: none; padding-bottom: 16px; }
.tab-sec.vis { display: block; }

/* ── 스크롤 힌트 ── */
.scroll-hint {
  text-align: center;
  font-size: 10px;
  color: var(--hint);
  padding: 4px 0 2px;
}
</style>
</head>
<body>

<!-- 상단바 -->
<div class="top-bar">
  <div class="top-row">
    <div class="logo">해남 문화달력<span>2026년 5월</span></div>
    <div class="top-actions">
      <button class="icon-btn" onclick="openSaved()" aria-label="담은 것">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span class="badge" id="saved-badge" style="display:none;"></span>
      </button>
      <button class="icon-btn" aria-label="검색">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>
  </div>
  <div class="view-tabs">
    <button class="vt on" onclick="sw('day',this)">오늘</button>
    <button class="vt" onclick="sw('week',this)">이번 주</button>
    <button class="vt" onclick="sw('month',this)">이번 달</button>
    <button class="vt" onclick="sw('hot',this)">인기순</button>
  </div>
</div>

<!-- 메인 콘텐츠 -->
<div id="main-content">

  <!-- ── 일간 ── -->
  <div class="tab-sec vis" id="v-day">
    <div class="date-strip-wrap">
      <div class="scroll-hint">← 밀어서 날짜 이동 →</div>
      <div class="date-strip" id="date-strip"></div>
    </div>
    <div class="sec-hd">
      <span class="sec-title" id="day-title">5월 15일 행사</span>
      <span class="sec-cnt" id="day-cnt">0건</span>
    </div>
    <div class="ev-list" id="ev-list"></div>
  </div>

  <!-- ── 주간 ── -->
  <div class="tab-sec" id="v-week">
    <div class="sec-hd">
      <span class="sec-title">5월 둘째 주</span>
      <span class="sec-cnt" style="background:var(--exhi-bg);color:var(--exhi);">5.10~16</span>
    </div>
    <div class="week-body" id="week-body"></div>
  </div>

  <!-- ── 월간 ── -->
  <div class="tab-sec" id="v-month">
    <div class="month-body">
      <div class="cal-legend">
        <div class="ll"><div class="ldot" style="background:var(--perf);"></div>공연</div>
        <div class="ll"><div class="ldot" style="background:var(--trad);"></div>전통</div>
        <div class="ll"><div class="ldot" style="background:var(--exhi);"></div>전시</div>

// 날짜별 행사 맵
function getByDate(d) {
  return events.filter(function(e) {
    if(e.endDate) return d >= e.date && d <= e.endDate;
    return e.date === d;
  });
}

// ── 날짜 스트립 ──
function buildStrip() {
  var strip = document.getElementById('date-strip');
  strip.innerHTML = '';
  var days = [
    {d:13,label:'화'},{d:14,label:'목'},{d:15,label:'오늘'},
    {d:16,label:'토'},{d:17,label:'일'},{d:18,label:'월'},
    {d:19,label:'화'},{d:20,label:'수'},{d:21,label:'목'},
    {d:22,label:'금'},{d:23,label:'토'}
  ];
  days.forEach(function(info) {
    var evs = getByDate(info.d);
    var btn = document.createElement('div');
    btn.className = 'db' + (info.d === currentDay ? ' cur' : '') + (evs.length === 0 ? ' no-ev' : '');
    btn.innerHTML =
      '<span class="dow">' + info.label + '</span>' +
      '<span class="num">' + info.d + '</span>' +
      '<div class="dots">' +
        evs.slice(0,4).map(function(e){ return '<div class="dot" style="background:' + catColors[e.cat].dot + ';"></div>'; }).join('') +
      '</div>';
    btn.onclick = function() { selectDay(info.d); };
    strip.appendChild(btn);
  });
}

function selectDay(d) {
  currentDay = d;
  buildStrip();
  renderDayEvents(d);
}

function renderDayEvents(d) {
  var evs = getByDate(d);
  document.getElementById('day-title').textContent = '5월 ' + d + '일 행사';

    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-msg">이 날은 행사가 없어요<br>다른 날짜를 확인해 보세요</div><button class="nearby-btn" onclick="sw(\'week\',document.querySelectorAll(\'.vt\')[1])">이번 주 행사 보기</button></div>';
    return;
  }
  list.innerHTML = evs.map(function(ev, i) {
    var cc = catColors[ev.cat];
    var isSaved = !!savedSet[ev.id];
    var isHot = ev.saves >= 50;
    return '<div class="ev-card" style="animation-delay:' + (i*0.05) + 's" onclick="openModal(' + ev.id + ')">' +
      '<div class="ev-top">' +
        '<span class="cat-tag" style="background:' + cc.bg + ';color:' + cc.c + ';">' + ev.catL + '</span>' +
        (ev.price === '무료' || ev.price === '체험비 무료' ? '<span class="free-tag">무료</span>' : '') +
        (isHot ? '<span class="hot-tag">🔥 ' + ev.saves + '명 담는 중</span>' : '') +
        '<button class="heart-btn' + (isSaved?' on':'') + '" onclick="event.stopPropagation();toggleSave(' + ev.id + ',this)" aria-label="담기">' +
          '<svg viewBox="0 0 24 24" width="20" height="20" fill="' + (isSaved?'#E04070':'none') + '" stroke="' + (isSaved?'#E04070':'currentColor') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="ev-title">' + ev.title + '</div>' +
      '<div class="ev-meta"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>' + ev.time + (ev.endDate ? ' · ' + ev.date + '~' + ev.endDate + '일' : '') + '</div>' +
      '<div class="ev-meta"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' + ev.place + '</div>' +
      '<div class="ev-meta"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>' + ev.who + '</div>' +
      '<div class="ev-bottom">' +
        '<div class="saves-info"><svg width="13" height="13" viewBox="0 0 24 24" fill="#E04070" stroke="#E04070" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="saves-num">' + ev.saves + '</span>명이 담았어요</div>' +
        '<button class="detail-btn" onclick="event.stopPropagation();openModal(' + ev.id + ')">자세히 보기</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ── 주간 ──
function buildWeek() {
  var wb = document.getElementById('week-body');
  var weekData = [
    {d:10,label:'일 10일',evDates:[10]},
    {d:11,label:'월 11일',evDates:[11]},
    {d:12,label:'화 12일',evDates:[12]},
    {d:13,label:'수 13일',evDates:[13]},
    {d:14,label:'목 14일',evDates:[14]},
    {d:15,label:'오늘 금 15일',evDates:[15],today:true},
    {d:16,label:'토 16일',evDates:[16]}
  ];
  wb.innerHTML = weekData.map(function(day) {
    var evs = getByDate(day.d);
    if(evs.length === 0) return '';
    return '<div class="week-day">' +
      '<div class="week-dhd' + (day.today?' today-hd':'') + '"><span>' + day.label + '</span><span>' + evs.length + '건</span></div>' +
      evs.map(function(ev) {
        var cc = catColors[ev.cat];
        var isSaved = !!savedSet[ev.id];
        return '<div class="week-ev" onclick="openModal(' + ev.id + ')">' +
          '<div class="wdot" style="background:' + cc.dot + ';"></div>' +
          '<div class="winfo">' +
            '<div class="wname">' + ev.title + '</div>' +
            '<div class="wmeta">' + ev.time + ' · ' + ev.place.split(' ')[0] + ' · ' + (ev.price==='무료'?'무료':ev.price) + '</div>' +
          '</div>' +
          '<div class="wsaves"><span>' + ev.saves + '</span>명</div>' +
          '<button class="wheart' + (isSaved?' on':'') + '" onclick="event.stopPropagation();toggleSave(' + ev.id + ',this)" aria-label="담기">♥</button>' +
        '</div>';
      }).join('') +
    '</div>';
  }).join('');
}

// ── 월간 ──
function buildCal() {
  var g = document.getElementById('cal-grid');
  ['일','월','화','수','목','금','토'].forEach(function(d) {
    var c = document.createElement('div'); c.className='cdow'; c.textContent=d; g.appendChild(c);
  });
  for(var i=0;i<4;i++){var e=document.createElement('div');e.className='cc emp';g.appendChild(e);}
  for(var d=1;d<=31;d++){
    var evs = getByDate(d);
    var cell = document.createElement('div');
    cell.className = 'cc' + (d===15?' tod':'');
    var num = document.createElement('span'); num.className='cnum'; num.textContent=d;
    cell.appendChild(num);
    var dots = document.createElement('div'); dots.className='cdots';
    var cats = {}; evs.forEach(function(e){ cats[e.cat]=1; });
    Object.keys(cats).slice(0,4).forEach(function(cat){
      var dot = document.createElement('div'); dot.className='cdot'; dot.style.background=catColors[cat].dot; dots.appendChild(dot);
    });
    cell.appendChild(dots);
    (function(dd){ cell.onclick=function(){ sw('day',document.querySelector('.vt')); selectDay(dd); scrollTo(0,0); }; })(d);
    g.appendChild(cell);
  }
}

// ── 인기 ──
function buildHot() {
  var sorted = events.slice().sort(function(a,b){return b.saves-a.saves;});
  var unique = []; var seen = {};
  sorted.forEach(function(e){if(!seen[e.title]){seen[e.title]=1;unique.push(e);}});
  var top = unique.slice(0,8);
  document.getElementById('hot-list').innerHTML = top.map(function(ev,i) {
    var cc = catColors[ev.cat];
    var rankC = i===0?'gold':i===1?'silver':i===2?'bronze':'';
    return '<div class="hot-item" onclick="openModal(' + ev.id + ')">' +
      '<span class="hot-rank ' + rankC + '">' + (i+1) + '</span>' +
      '<div class="hot-info">' +
        '<div class="hot-name">' + ev.title + '</div>' +
        '<div class="hot-sub">' +
          '<span style="background:' + cc.bg + ';color:' + cc.c + ';font-size:9px;padding:2px 7px;border-radius:20px;font-weight:700;">' + ev.catL + '</span>' +
          '5.' + ev.date + (ev.endDate?'~'+ev.endDate:'') + ' · ' + (ev.price==='무료'?'무료':ev.price) +
        '</div>' +
      '</div>' +
      '<div class="hot-saves"><svg width="14" height="14" viewBox="0 0 24 24" fill="#E04070" stroke="#E04070" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' + ev.saves + '</div>' +
    '</div>';
  }).join('');
}

// ── 모달 ──
function openModal(id) {
  var ev = events.find(function(e){return e.id===id;});
  if(!ev) return;
  currentModal = ev;
  var cc = catColors[ev.cat];
  var isSaved = !!savedSet[ev.id];
  document.getElementById('m-cat').innerHTML =
    '<span class="cat-tag" style="background:' + cc.bg + ';color:' + cc.c + ';">' + ev.catL + '</span>' +
    (ev.price==='무료'||ev.price==='체험비 무료' ? '<span class="free-tag">무료</span>' : '');
  document.getElementById('m-title').textContent = ev.title;
  document.getElementById('m-info').innerHTML = [
    ['일정', '5월 ' + ev.date + '일' + (ev.endDate?' ~ ' + ev.endDate + '일':'') + ' ' + ev.time],
    ['장소', ev.place],
    ['대상', ev.who],
    ['가격', ev.price],
    ['주최', '해남군 문화예술과 · 061-530-5137'],
    ['문의', '☎ ' + ev.contact]
  ].map(function(r){
    return '<div class="modal-info-row"><span class="mi-label">' + r[0] + '</span><span class="mi-val">' + r[1] + '</span></div>';
  }).join('');
  document.getElementById('m-desc').textContent = ev.desc;
  document.getElementById('m-saves').innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="#E04070" stroke="#E04070" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><strong>' + ev.saves + '명</strong>이 이 행사를 담았어요';
  var callBtn = document.getElementById('m-call-btn');
  callBtn.innerHTML = '📞 전화 문의';
  callBtn.onclick = function(){ showToast('☎ 061-' + ev.contact + ' 연결 중...'); };
  var saveBtn = document.getElementById('m-save-btn');
  saveBtn.innerHTML = isSaved ? '♥ 담기 취소' : '♡ 담기';
  saveBtn.className = isSaved ? 'm-save saved' : 'm-save';
  document.getElementById('modal-backdrop').classList.add('open');
}

function modalToggleSave() {
  if(!currentModal) return;
  toggleSave(currentModal.id, null);
  var isSaved = !!savedSet[currentModal.id];
  var btn = document.getElementById('m-save-btn');
  btn.innerHTML = isSaved ? '♥ 담기 취소' : '♡ 담기';
  btn.className = isSaved ? 'm-save saved' : 'm-save';
}

function closeModal(e) { if(e.target === document.getElementById('modal-backdrop')) closeModalDirect(); }
function closeModalDirect() { document.getElementById('modal-backdrop').classList.remove('open'); }

// ── 담기 ──
function toggleSave(id, btn) {
  var ev = events.find(function(e){return e.id===id;});
  if(savedSet[id]) {
    delete savedSet[id];
    if(btn) { btn.classList.remove('on'); btn.querySelector('svg path').setAttribute('fill','none'); btn.querySelector('svg path').setAttribute('stroke','currentColor'); }
    showToast('담기 취소됐어요');
  } else {
    savedSet[id] = ev;
    if(btn) { btn.classList.add('on'); btn.querySelector('svg path').setAttribute('fill','#E04070'); btn.querySelector('svg path').setAttribute('stroke','#E04070'); }
    showToast('"' + ev.title.slice(0,12) + (ev.title.length>12?'…':'') + '" 담았어요!');
  }
  var cnt = Object.keys(savedSet).length;
  document.getElementById('saved-badge').style.display = cnt > 0 ? 'block' : 'none';
  renderDayEvents(currentDay);
  buildWeek();
}

// ── 담은 것 패널 ──
function openSaved() {
  var panel = document.getElementById('saved-panel');
  var body = document.getElementById('saved-body');
  var keys = Object.keys(savedSet);
  document.getElementById('saved-count-label').textContent = keys.length + '개';
  if(keys.length === 0) {
    body.innerHTML = '<div class="saved-empty">💚<br><br>아직 담은 행사가 없어요<br>마음에 드는 행사에 하트를 눌러보세요</div>';
  } else {
    var evs = keys.map(function(k){return savedSet[k];}).sort(function(a,b){return a.date-b.date;});
    body.innerHTML = evs.map(function(ev) {
      var cc = catColors[ev.cat];
      var diff = ev.date - 15;
      var ddayHtml = diff < 0 ? '<span class="dday-badge dday-past">지남</span>' :
                     diff === 0 ? '<span class="dday-badge dday-today">오늘!</span>' :
                     '<span class="dday-badge dday-soon">D-' + diff + '</span>';
      return '<div class="saved-ev">' +
        '<div class="saved-ev-top">' +
          '<span class="cat-tag" style="background:' + cc.bg + ';color:' + cc.c + ';">' + ev.catL + '</span>' +
          (ev.price==='무료'||ev.price==='체험비 무료'?'<span class="free-tag">무료</span>':'') +
          ddayHtml +
        '</div>' +
        '<div class="sev-name">' + ev.title + '</div>' +
        '<div class="sev-meta">5.' + ev.date + (ev.endDate?' ~ '+ev.endDate:'') + ' · ' + ev.time + '</div>' +
        '<div class="sev-meta">' + ev.place + '</div>' +
        '<div class="sev-bot">' +
          '<button class="sev-call" onclick="showToast(\'☎ 061-' + ev.contact + ' 연결 중...\')">📞 문의 전화</button>' +
          '<button class="sev-call" onclick="openModal(' + ev.id + ')">자세히</button>' +
          '<button class="sev-remove" onclick="toggleSave(' + ev.id + ',null);openSaved()">취소</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }
  panel.classList.add('open');
  document.querySelectorAll('.bn').forEach(function(b){b.classList.remove('on');});
  document.getElementById('bn-saved').classList.add('on');
}

function closeSaved() {
  document.getElementById('saved-panel').classList.remove('open');
  document.querySelectorAll('.bn').forEach(function(b){b.classList.remove('on');});
  document.getElementById('bn-cal').classList.add('on');
}

function showMain() {
  document.getElementById('saved-panel').classList.remove('open');
  document.querySelectorAll('.bn').forEach(function(b){b.classList.remove('on');});
  document.getElementById('bn-cal').classList.add('on');
}

// ── 탭 전환 ──
function sw(v, btn) {
  document.querySelectorAll('.tab-sec').forEach(function(s){s.classList.remove('vis');});
  document.getElementById('v-'+v).classList.add('vis');
  document.querySelectorAll('.vt').forEach(function(t){t.classList.remove('on');});
  btn.classList.add('on');
}

// ── 토스트 ──
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function(){t.classList.remove('show');}, 2000);
}

// ── 초기화 ──
buildStrip();
renderDayEvents(15);
buildWeek();
buildCal();
buildHot();
</script>
</body>
</html>
