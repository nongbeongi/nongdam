<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>케어플레이</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap');

/* ── 리셋 & 기본 ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bl:#2563EB;--bll:#EFF6FF;--bld:#1D4ED8;
  --gn:#16A34A;--gnl:#F0FDF4;
  --rd:#DC2626;--rdl:#FEF2F2;
  --am:#D97706;--aml:#FFFBEB;
  --pu:#7C3AED;--pul:#F5F3FF;
  --gy:#6B7280;--gyl:#F9FAFB;
  --bg:#F1F5F9;--sur:#FFFFFF;--bd:#E2E8F0;
  --tx:#0F172A;--tx2:#64748B;--tx3:#94A3B8;
  --r:16px;--r-sm:10px;--r-xs:8px;
  --sh:0 1px 4px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04);
  --sh-md:0 4px 20px rgba(0,0,0,.10);
}
html,body{height:100%;background:var(--bg);overflow:hidden;color:var(--tx);-webkit-font-smoothing:antialiased;font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5}
#wrap{height:100vh;display:flex;justify-content:center;background:linear-gradient(160deg,#CBD5E1,#E2E8F0)}
.app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 80px rgba(15,23,42,.25)}

/* ── 화면 전환 ── */
#s-admin,#s-coach,#s-user{display:none;flex-direction:column;height:100%;overflow:hidden}

/* ── 로그인 ── */
#login{position:absolute;inset:0;z-index:99;background:linear-gradient(170deg,#0C1120 0%,#1E3560 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:32px 24px;padding-bottom:max(32px,env(safe-area-inset-bottom))}
#login.off{display:none}
.lg-top{text-align:center;margin-bottom:36px;padding-top:40px}
.lg-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:5px 12px;margin-bottom:18px;font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.8px;text-transform:uppercase}
.lg-logo{font-size:52px;display:block;margin-bottom:10px;filter:drop-shadow(0 0 24px rgba(59,130,246,.5))}
.lg-logo-h1{color:#fff;font-size:30px;font-weight:900;letter-spacing:-1.2px}
.lg-logo-sub{color:rgba(255,255,255,.3);font-size:13px;margin-top:6px;letter-spacing:.3px}
.role-tabs{display:flex;background:rgba(255,255,255,.06);border-radius:14px;padding:4px;gap:3px;margin-bottom:14px}
.role-tab{flex:1;padding:11px;border:none;background:transparent;color:rgba(255,255,255,.35);font-size:14px;font-weight:600;border-radius:11px;cursor:pointer;font-family:inherit;transition:.2s;letter-spacing:-.2px}
.role-tab.on{background:var(--bl);color:#fff;box-shadow:0 2px 10px rgba(37,99,235,.45)}
.lg-inp{width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.09);border-radius:13px;padding:14px 16px;color:#fff;font-size:15px;font-family:inherit;margin-bottom:10px;outline:none;transition:.2s}
.lg-inp:focus{border-color:rgba(59,130,246,.55);background:rgba(255,255,255,.11)}
.lg-inp::placeholder{color:rgba(255,255,255,.22)}
.lg-btn{width:100%;padding:16px;background:var(--bl);color:#fff;border:none;border-radius:13px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px;box-shadow:0 4px 24px rgba(37,99,235,.45);letter-spacing:-.3px;transition:.15s}
.lg-btn:active{transform:scale(.98);opacity:.88}
.lg-err{color:#FCA5A5;font-size:13px;text-align:center;margin-top:10px;min-height:18px;font-weight:500}
.lg-hint{color:rgba(255,255,255,.18);font-size:12px;text-align:center;margin-top:10px}

/* ── 헤더 ── */
.hdr{height:56px;background:var(--sur);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;box-shadow:0 1px 0 var(--bd)}
.hdr-title{font-size:17px;font-weight:800;flex:1;letter-spacing:-.6px;color:var(--tx)}
.hdr-sub{font-size:13px;color:var(--tx2);flex:1;text-align:center;font-weight:500}
.hdr-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--bg);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--tx2);transition:.1s}
.hdr-btn:hover{background:var(--bd)}
.hdr-btn:active{background:var(--bd);transform:scale(.95)}

/* ── 탭바 ── */
.tabbar{height:62px;background:var(--sur);border-top:1px solid var(--bd);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:none;cursor:pointer;font-family:inherit;position:relative;transition:.1s}
.tb-i{font-size:22px;color:var(--tx3);line-height:1;transition:.15s}
.tb-l{font-size:10px;color:var(--tx3);font-weight:500;letter-spacing:-.1px;transition:.15s}
.tb.on .tb-i{color:var(--bl);transform:translateY(-1px)}
.tb.on .tb-l{color:var(--bl);font-weight:700}
.tb.on::after{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--bl);border-radius:0 0 6px 6px}
.tb-dot{position:absolute;top:7px;right:calc(50% - 20px);width:7px;height:7px;background:var(--rd);border-radius:50%;border:2px solid var(--sur)}

/* ── 스크롤 ── */
.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{display:none}
.page{display:none;padding:14px 14px 28px;animation:fu .2s ease}
.page.on{display:block}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── 카드 ── */
.card{background:var(--sur);border-radius:var(--r);overflow:hidden;margin-bottom:12px;box-shadow:var(--sh)}
.cb{padding:16px}
.ct{font-size:11px;font-weight:800;color:var(--tx3);letter-spacing:.7px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.sec{font-size:13px;font-weight:700;color:var(--tx2);margin:16px 0 8px;display:flex;align-items:center;justify-content:space-between;letter-spacing:-.2px}
.sec:first-child{margin-top:0}

/* ── 리스트 행 ── */
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:none;padding-bottom:0}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.av-s{width:32px;height:32px;font-size:13px;flex-shrink:0}
.ri{flex:1;min-width:0}
.rn{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.2px;color:var(--tx)}
.rs{font-size:12px;color:var(--tx2);margin-top:2px;line-height:1.5}

/* ── 이달 일정 row (전용) ── */
.ev-row{padding:11px 0;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.ev-row:last-child{border-bottom:none;padding-bottom:0}
.ev-info{flex:1;min-width:0}
.ev-name{font-size:14px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.2px;margin-bottom:2px}
.ev-meta{font-size:11px;color:var(--tx2);line-height:1.4}
.ev-time{background:var(--bll,#EFF6FF);color:var(--bl);font-weight:700;padding:1px 5px;border-radius:5px;font-size:11px}
.ev-actions{display:flex;gap:4px;flex-shrink:0}

/* ── 버튼 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 14px;height:38px;border-radius:var(--r-sm);font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit;white-space:nowrap;line-height:1;letter-spacing:-.2px;transition:.12s}
.btn:active{opacity:.72;transform:scale(.96)}
.bl{background:var(--bl);color:#fff}
.gn{background:var(--gnl);color:var(--gn)}
.rd{background:var(--rdl);color:var(--rd)}
.am{background:var(--aml);color:var(--am)}
.gy{background:var(--bg);color:var(--tx);border:1.5px solid var(--bd)}
.pu{background:var(--pul);color:var(--pu)}
.W{width:100%}
.LG{height:50px;font-size:15px;border-radius:14px;font-weight:700}
.SM{height:30px;padding:0 10px;font-size:12px;border-radius:7px}
.XS{height:26px;padding:0 8px;font-size:11px;border-radius:6px}

/* ── 출결 버튼 ── */
.ab{height:36px;min-width:40px;border-radius:8px;border:2px solid transparent;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0 6px;letter-spacing:-.2px;transition:.12s}
.ab:active{transform:scale(.9)}
.ab.a0{background:var(--bg);color:var(--tx3);border-color:var(--bd)}
.ab.a1{background:#DCFCE7;color:#15803D;border-color:#86EFAC}
.ab.a2{background:#DBEAFE;color:#1D4ED8;border-color:#93C5FD}
.ab.a3{background:#FEE2E2;color:#B91C1C;border-color:#FECACA}
.ab.a4{background:#FEF9C3;color:#92400E;border-color:#FDE047}

/* ── 배지 ── */
.bx{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;line-height:1.6;letter-spacing:-.1px}
.bx.gn{background:var(--gnl);color:var(--gn)}.bx.rd{background:var(--rdl);color:var(--rd)}
.bx.am{background:var(--aml);color:var(--am)}.bx.bl{background:var(--bll,#EFF6FF);color:var(--bl)}
.bx.gy{background:var(--bg);color:var(--gy);border:1px solid var(--bd)}.bx.pu{background:var(--pul);color:var(--pu)}

/* ── 배너 ── */
.banner{border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:flex-start;gap:10px}
.bn-r{background:#FEF2F2;border:1px solid #FED7D7}
.bn-a{background:#FFFBEB;border:1px solid #FEF3C7}
.bn-g{background:#F0FDF4;border:1px solid #BBF7D0}
.bn-b{background:#EFF6FF;border:1px solid #BFDBFE}
.bn-i{font-size:18px;flex-shrink:0;margin-top:1px}
.bn-t{flex:1;min-width:0}
.bn-m{font-size:13px;font-weight:700;color:var(--tx);line-height:1.4}
.bn-s{font-size:12px;color:var(--tx2);margin-top:3px;line-height:1.5}

/* ── 코치 헤더 ── */
.c-hdr{background:linear-gradient(135deg,#1E1B4B 0%,#4338CA 100%);padding:14px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.c-hdr .av{background:rgba(255,255,255,.18);color:#fff;width:44px;height:44px;font-size:18px}
.c-nm{color:#fff;font-size:17px;font-weight:800;letter-spacing:-.4px}
.c-dt{color:rgba(255,255,255,.45);font-size:12px;margin-top:2px}
.c-tag{margin-left:auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:5px 12px;font-size:12px;color:rgba(255,255,255,.8);white-space:nowrap}

/* ── 이용자 히어로 ── */
.u-hero{background:linear-gradient(135deg,#1E40AF 0%,#2563EB 60%,#3B82F6 100%);border-radius:20px;padding:20px;margin-bottom:12px;box-shadow:0 8px 28px rgba(37,99,235,.35)}
.u-nm{color:#fff;font-size:20px;font-weight:900;letter-spacing:-.6px}
.u-sb{color:rgba(255,255,255,.5);font-size:13px;margin-top:4px;margin-bottom:16px;letter-spacing:-.1px}
.u-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.u-box{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;transition:.15s}
.u-box:active{background:rgba(255,255,255,.2);transform:scale(.97)}
.u-val{font-size:22px;font-weight:800;color:#fff;line-height:1}
.u-lbl{font-size:10px;color:rgba(255,255,255,.5);margin-top:4px;line-height:1.4}

/* ── 수납 요약 ── */
.pay-s{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pay-b{background:var(--sur);border-radius:14px;padding:16px;text-align:center;box-shadow:var(--sh)}
.pay-v{font-size:19px;font-weight:800;line-height:1.2;letter-spacing:-.5px}
.pay-l{font-size:11px;color:var(--tx3);margin-top:4px;font-weight:500}

/* ── 정산 헤더 ── */
.settle-h{background:linear-gradient(135deg,#064E3B 0%,#059669 100%);border-radius:16px;padding:20px;color:#fff;margin-bottom:12px;box-shadow:0 6px 24px rgba(5,150,105,.3)}
.settle-v{font-size:30px;font-weight:800;line-height:1;margin-top:4px;letter-spacing:-.5px}
.settle-r{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.55);margin-top:10px}

/* ── 달력 ── */
.cal-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--sur);border-bottom:1px solid var(--bd)}
.cal-mn{font-size:16px;font-weight:800;letter-spacing:-.5px;color:var(--tx)}
.cal-nb{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--bd);background:var(--bg);cursor:pointer;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--tx);transition:.1s}
.cal-nb:active{background:var(--bd)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dow{padding:7px 2px;font-size:11px;font-weight:700;color:var(--tx3);text-align:center;background:var(--bg);letter-spacing:.1px}
.cal-dow:first-child{color:#EF4444}.cal-dow:last-child{color:var(--bl)}
.cal-day{min-height:58px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:3px;cursor:pointer;background:var(--sur);overflow:hidden;position:relative;transition:.08s}
.cal-day:nth-child(7n){border-right:none}
.cal-day:active{background:#F1F5F9}
.cal-day.ot{background:var(--bg);opacity:.4;pointer-events:none}
.cal-day.td{background:#EFF6FF}
.cal-day.hl{background:#F0FDF4}
.cal-day.sel{background:#EFF6FF;outline:2.5px solid var(--bl);outline-offset:-1px;z-index:1}
.dn{font-size:11px;font-weight:600;margin-bottom:2px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--tx)}
.dn.tn{background:var(--bl);color:#fff;font-weight:800}
.dn.sn{color:#EF4444}.dn.sa{color:var(--bl)}
.cc{font-size:9px;padding:2px 4px;border-radius:4px;color:#fff;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;line-height:1.4;font-weight:600}
.cc-g{background:#16A34A}.cc-p{background:#2563EB}.cc-r{background:#D97706}.cc-o{background:#64748B}

/* ── 더보기 ── */
.more-mn{background:var(--sur);border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:var(--sh)}
.more-it{display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid var(--bd);cursor:pointer;transition:.1s}
.more-it:last-child{border-bottom:none}
.more-it:active{background:var(--bg)}
.more-ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.more-tx{flex:1}.more-nm{font-size:15px;font-weight:700;letter-spacing:-.3px}.more-ds{font-size:12px;color:var(--tx2);margin-top:2px}

/* ── 탭 필터 ── */
.filter-tabs{display:flex;gap:6px;padding:10px 0 6px;flex-wrap:wrap}
.ftab{padding:7px 14px;border-radius:20px;border:1.5px solid var(--bd);background:var(--sur);font-size:12px;font-weight:600;cursor:pointer;color:var(--tx2);transition:.12s;font-family:inherit}
.ftab:active{transform:scale(.96)}
.ftab.on{background:var(--bl);color:#fff;border-color:var(--bl);box-shadow:0 2px 8px rgba(37,99,235,.3)}

/* ── 폼 ── */
.f{margin-bottom:14px}
.f label{display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.fi{width:100%;padding:12px 14px;background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;font-size:15px;font-family:inherit;color:var(--tx);outline:none;-webkit-appearance:none;transition:.15s}
.fi:focus{border-color:var(--bl);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
select.fi{cursor:pointer}
textarea.fi{min-height:80px;resize:none;line-height:1.6}
.f-row{display:flex;gap:10px}.f-row .f{flex:1}
.ib{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.6;font-weight:500}
.ib.bl{background:#EFF6FF;color:var(--bld)}.ib.am{background:var(--aml);color:var(--am)}.ib.gn{background:var(--gnl);color:var(--gn)}.ib.rd{background:var(--rdl);color:var(--rd)}
.btn-row{display:flex;gap:8px;margin-top:6px}.btn-row .btn{flex:1}

/* ── 모달 ── */
.dim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dim.open{display:flex;align-items:flex-end;justify-content:center}
.dim.ct{align-items:center}
.modal{background:var(--sur);border-radius:24px 24px 0 0;width:100%;max-width:430px;max-height:92vh;overflow-y:auto;padding:20px 18px;padding-bottom:max(24px,env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(0,0,0,.2)}
.dim.ct .modal{border-radius:20px;margin:16px;width:calc(100% - 32px);padding-bottom:20px}
.modal::-webkit-scrollbar{display:none}
.m-bar{width:36px;height:4px;background:var(--bd);border-radius:2px;margin:0 auto 16px}
.m-title{font-size:18px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;letter-spacing:-.5px;color:var(--tx)}
.m-x{background:none;border:none;font-size:22px;color:var(--tx3);cursor:pointer;padding:0;line-height:1;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:.1s}
.m-x:active{background:var(--bg)}

/* ── 상세 정보 ── */
.detail-row{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bd);gap:10px}
.detail-row:last-child{border-bottom:none;padding-bottom:0}
.detail-key{color:var(--tx2);flex-shrink:0;font-size:13px;font-weight:500}
.detail-val{font-weight:600;text-align:right;font-size:13px;color:var(--tx)}

/* ── 토스트 ── */
#toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%) translateY(14px);background:#111827;color:#fff;padding:11px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:all .22s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;max-width:90vw;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.35);letter-spacing:-.2px}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="wrap"><div class="app" id="app">
<!-- 로그인 -->
<div id="login">
  <div class="lg-top">
    <div class="lg-badge">⚾ careplay</div>
    <span class="lg-logo">⚾</span>
    <h1 class="lg-logo-h1">케어플레이</h1>
    <p class="lg-logo-sub">해남군 삼산면 실내야구장</p>
  </div>
  <div class="role-tabs">
    <button class="role-tab on" onclick="setRole('admin',this)">관리자</button>
    <button class="role-tab" onclick="setRole('coach',this)">코치</button>
    <button class="role-tab" onclick="setRole('user',this)">이용자</button>
  </div>
  <div id="lg-f"></div>
  <button class="lg-btn" onclick="doLogin()">로그인</button>
  <div class="lg-err" id="lg-e"></div>
  <div class="lg-hint" id="lg-h"></div>
</div>
<!-- 관리자 -->
<div id="s-admin">
  <div class="hdr">

// Supabase로 동기화 (upsert)
function syncToSupabase(){
  if(!SUPABASE_URL||!SUPABASE_KEY)return;
  var payload={id:'main',updated_at:new Date().toISOString(),data:{
    members:S.members,events:S.events,att:S.att,pays:S.pays,
    settles:S.settles,notices:S.notices,makeups:S.makeups,
    coaches:S.coaches,classes:S.classes,admin:S.admin
  }};
  fetch(SUPABASE_URL+'/rest/v1/careplay_data',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'apikey':SUPABASE_KEY,
      'Authorization':'Bearer '+SUPABASE_KEY,
      'Prefer':'resolution=merge-duplicates,return=minimal'
    },
    body:JSON.stringify(payload)
  }).then(function(r){
    if(!r.ok)r.text().then(function(t){console.warn('Supabase sync error:',r.status,t);});
  }).catch(function(e){console.warn('Supabase sync fail:',e);});
}

// Supabase에서 불러오기
function loadFromSupabase(cb){
  if(!SUPABASE_URL||!SUPABASE_KEY){if(cb)cb();return;}
  fetch(SUPABASE_URL+'/rest/v1/careplay_data?id=eq.main&select=data',{
    headers:{
      'apikey':SUPABASE_KEY,
      'Authorization':'Bearer '+SUPABASE_KEY
    }
  }).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(rows){
    if(rows&&rows[0]&&rows[0].data){
      var d=rows[0].data;
      // 필드별 안전 복원 (기본값 유지)
      if(d.members)S.members=d.members;
      if(d.events)S.events=d.events;
      if(d.att)S.att=d.att;
      if(d.pays)S.pays=d.pays;
      if(d.settles)S.settles=d.settles;
      if(d.notices)S.notices=d.notices;
      if(d.makeups)S.makeups=d.makeups;
      if(d.coaches)S.coaches=d.coaches;
      if(d.classes)S.classes=d.classes;
      if(d.admin)S.admin=Object.assign(S.admin,d.admin);
      // localStorage 캐시 갱신
      try{localStorage.setItem('cpv2',JSON.stringify(d));}catch(e){}
    }
    if(cb)cb();
  }).catch(function(e){
    console.warn('Supabase load fail:',e);
    if(cb)cb(); // 실패해도 로컬 데이터로 진행
  });
}

function calcSess(evId){
  var ev=S.events.find(function(e){return e.id===evId;});if(!ev)return 0;
  var mm=ev.date.slice(0,7);
  return S.events.filter(function(e){return e.type===ev.type&&e.coach===ev.coach&&e.date.slice(0,7)===mm;}).sort(function(a,b){return a.date>b.date?1:-1;}).findIndex(function(e){return e.id===evId;})+1;
}

function renderCalGrid(containerId,y,m,selDate,coachFilter,onClickDay,onPrev,onNext){
  var el=$_(containerId);if(!el)return;
  var fd=new Date(y,m,1).getDay(),ld=new Date(y,m+1,0).getDate(),pl=new Date(y,m,0).getDate();
  var td=today();
  // 코치 필터 버튼
  var filterHtml='<div class="filter-tabs"><button class="ftab '+(coachFilter===''?'on':'')+'" data-filter="" onclick="setCalFilter(\'\',\''+containerId+'\')">전체</button>';
  S.coaches.forEach(function(c){filterHtml+='<button class="ftab '+(coachFilter===c.name?'on':'')+'" data-filter="'+c.name+'" onclick="setCalFilter(\''+c.name+'\',\''+containerId+'\')">'+c.name+'</button>';});
  filterHtml+='</div>';
  var h=filterHtml+'<div class="card"><div class="cal-hdr">'
    +'<button class="cal-nb" onclick="'+onPrev+'()">‹</button>'
    +'<span class="cal-mn">'+y+'년 '+(m+1)+'월</span>'
    +'<button class="cal-nb" onclick="'+onNext+'()">›</button>'
    +'</div><div class="cal-grid">';
  ['일','월','화','수','목','금','토'].forEach(function(d){h+='<div class="cal-dow">'+d+'</div>';});
  for(var i=0;i<fd;i++)h+='<div class="cal-day ot"><div class="dn">'+(pl-fd+1+i)+'</div></div>';
  for(var d=1;d<=ld;d++){
    var ds=y+'-'+S2(m+1)+'-'+S2(d),dow=new Date(y,m,d).getDay();
    var evs=S.events.filter(function(e){return e.date===ds&&(coachFilter===''||e.coach===coachFilter);});
    var hl=evs.some(function(e){return e.type==='group'||e.type==='personal';});
    var isSel=ds===selDate;
    var cls='cal-day'+(ds===td?' td':hl?' hl':'')+(isSel?' sel':'');
    h+='<div class="'+cls+'" data-date="'+ds+'" onclick="'+onClickDay+'(this.dataset.date)">';
    var nc='dn'+(ds===td?' tn':dow===0?' sn':dow===6?' sa':'');
    h+='<div class="'+nc+'">'+d+'</div>';
    evs.slice(0,3).forEach(function(ev){
      var cc=ev.type==='group'?'cc-g':ev.type==='personal'?'cc-p':ev.type==='rental'?'cc-r':'cc-o';
      var sn=(ev.type==='group'||ev.type==='personal')?calcSess(ev.id):0;

      h+='<span class="cc '+cc+'">'+(ev.time?ev.time.slice(0,5)+' ':'')+lbl+(sn?'('+sn+')':'')+'</span>';
    });
    if(evs.length>3)h+='<span style="font-size:8px;color:var(--tx3)">+'+( evs.length-3)+'</span>';
    h+='</div>';
  }
  var rem=7-((fd+ld)%7);if(rem<7){for(var j=1;j<=rem;j++)h+='<div class="cal-day ot"><div class="dn">'+j+'</div></div>';}
  h+='</div></div>';
  el.innerHTML=h;
}

function evRepChg(){
  var dt=($_('ev-dt')||{value:''}).value;
  var rep=($_('ev-rep')||{value:'none'}).value;
  var warn=$_('ev-rep-warn');
  if(!warn||rep==='none'||!dt){if(warn)warn.style.display='none';return;}
  // 선택한 날짜 요일과 반복 요일 불일치 확인
  var repMap={'mwf':[1,3,5],'tt':[2,4],'m':[1],'t':[2],'w':[3],'th':[4],'f':[5]};
  var days=repMap[rep]||[];
  if(!days.length){warn.style.display='none';return;}
  var selDow=new Date(dt).getDay();
  var selInRep=days.indexOf(selDow)>=0;
  // 반복이면 선택 날짜의 달(month)에서 생성
  var d0=new Date(dt),y=d0.getFullYear(),mo=d0.getMonth();
  var last=new Date(y,mo+1,0).getDate(),cnt=0;
  for(var d=1;d<=last;d++){if(days.indexOf(new Date(y,mo,d).getDay())>=0)cnt++;}
  warn.style.display='block';
  warn.textContent='⚠ '+y+'년 '+(mo+1)+'월 기준으로 '+cnt+'건이 추가됩니다.'+(selInRep?'':' (선택 날짜 요일은 해당 반복 패턴에 포함되지 않습니다)');

function doSaveEvent(){
  var editId=($_('ev-edit-id')||{value:''}).value;
  var date=($_('ev-dt')||{value:''}).value;if(!date){toast('날짜를 선택하세요','err');return;}
  var type=($_('ev-tp')||{value:'group'}).value;

  var coachName=($_('ev-co')||{value:''}).value;
  var time=($_('ev-tm')||{value:''}).value;
  var org=($_('ev-org')||{value:''}).value;
  var rtime=($_('ev-rt2')||{value:''}).value;
  var reason=($_('ev-rs')||{value:''}).value;
  var evLabel=($_('ev-label')||{value:''}).value.trim();
  var memberId=($_('ev-mem')||{value:''}).value;
  var memberName='';
  if(memberId){var mm=memberById(memberId);if(mm)memberName=mm.name;}
  if(editId){
    // 수정
    var ev=S.events.find(function(e){return e.id===editId;});
    if(ev){
      ev.date=date;ev.type=type;ev.coach=coachName;ev.time=time;
      ev.org=org||rtime;ev.reason=reason;ev.label=evLabel;
      if(type==='personal'){ev.memberId=memberId;ev.memberName=memberName;}
    }
    closeM('m-ev');save();toast('✅ 일정 수정됨','ok');renderAdminCal();return;
  }
  // 추가 (반복 포함)
  var repMap={'mwf':[1,3,5],'tt':[2,4],'m':[1],'t':[2],'w':[3],'th':[4],'f':[5]};
  var days=repMap[rep]||[];
  var dates=[];
  if(!days.length){dates=[date];}else{
    var d0=new Date(date),y=d0.getFullYear(),mo=d0.getMonth();
    for(var d=1;d<=new Date(y,mo+1,0).getDate();d++){
      if(days.indexOf(new Date(y,mo,d).getDay())>=0)dates.push(y+'-'+S2(mo+1)+'-'+S2(d));
    }
  }
  var gid = dates.length > 1 ? 'g'+Date.now() : '';
  dates.forEach(function(dt){
    var ev={id:'ev'+Date.now()+Math.random().toString(36).slice(2,5),date:dt,type:type,groupId:gid};

    else if(type==='off')ev.reason=reason;
    else if(type==='personal'){ev.memberId=memberId;ev.memberName=memberName;}
    S.events.push(ev);
  });
  closeM('m-ev');save();toast('✅ '+dates.length+'건 추가됨','ok');renderAdminCal();

      +'<button class="ab '+(hasMkToday?'a2':'a0')+'" data-mid="'+m.id+'" onclick="toggleMk(this.dataset.mid)">🎫</button>'

function doAtt(btn){
  var mid=btn.dataset.mid,v=parseInt(btn.dataset.v);
  var key=_attEvId+'_'+mid;
  var prev=S.att[key]||0,cur=prev===v?0:v;
  S.att[key]=cur;
  var m=memberById(mid);if(!m)return;
  // 무료(4): 차감 없이 기록만
  if(cur===4){save();renderAttDayPanel();return;}
  // 잔여 0 경고
  if((cur===1||cur===2||cur===3)&&prev===0&&m.remain<=0){
    toast(m.name+' 잔여 0 — 결제 갱신 필요','err');
  }
  // 차감 원칙: 출석(1)/보강(2)/노쇼(3) → 잔여 -1
  // 보강(2) 추가: 보강권 +1 자동 발급 (나중에 추가 수업 1회 사용 가능)
  // 무료(4) → 차감 없음
  var wasDeduct=(prev===1||prev===2||prev===3);
  var isDeduct=(cur===1||cur===2||cur===3);
  if(wasDeduct&&!isDeduct){m.remain++;if(m.totalRemain!==undefined)m.totalRemain++;}
  if(!wasDeduct&&isDeduct&&m.remain>0){m.remain--;if(m.totalRemain!==undefined&&m.totalRemain>0)m.totalRemain--;}
  // 보강(2) 선택 시: 보강권 자동 발급
  if(cur===2&&prev!==2){
    var exp2=new Date(today());exp2.setMonth(exp2.getMonth()+1);exp2.setDate(0);
    S.makeups.push({id:'mk'+Date.now()+mid,memberId:mid,memberName:m.name,
      createdDate:today(),expires:exp2.toISOString().slice(0,10),
      reason:'보강(사전연락)',usedDate:null,noticeId:null});
    toast(m.name+' 보강권 발급 — 잔여 -1','ok');
  }
  // 보강(2) 취소 시: 오늘 발급된 보강권 회수
  if(prev===2&&cur!==2){
    var todayMks=S.makeups.filter(function(x){return x.memberId===mid&&x.createdDate===today()&&x.reason==='보강(사전연락)'&&!x.usedDate;});
    if(todayMks.length){S.makeups=S.makeups.filter(function(x){return x.id!==todayMks[0].id;});toast(m.name+' 보강권 회수됨');}
  }
  save();var panel=$_('att-day-panel');if(panel)panel.innerHTML='';
  if(_attEvId){var el=$_('att-day-panel');if(el)el.innerHTML+='';renderAttDayPanel();}
}
function setAllAtt(v){
  var ev=S.events.find(function(e){return e.id===_attEvId;});if(!ev)return;
  var mems=ev.type==='group'?S.members.filter(function(m){return !m.suspended&&m.type==='group'&&m.coach===ev.coach;}):ev.memberId?[memberById(ev.memberId)].filter(Boolean):[];
  mems.forEach(function(m){
    var key=_attEvId+'_'+m.id,prev=S.att[key]||0;
    if(prev!==v){S.att[key]=v;if(prev!==1&&prev!==2&&v===1&&m.remain>0)m.remain--;else if((prev===1||prev===2)&&v!==1&&v!==2)m.remain++;}
  });
  save();toast('전체 출석','ok');renderAttDayPanel();
}
function toggleMk(mid){
  var m=memberById(mid);if(!m)return;
  var existing=S.makeups.find(function(mk){return mk.memberId===mid&&mk.reason==='사전연락'&&mk.createdDate===_attSelDate&&!mk.usedDate;});

    S.makeups=S.makeups.filter(function(mk){return mk.id!==existing.id;});

    var exp=new Date(_attSelDate||today());exp.setMonth(exp.getMonth()+1);exp.setDate(0);

}

// 그룹반 수업 시작
function startClass(clsId){
  var cls=S.classes.find(function(c){return c.id===clsId;});if(!cls)return;
  var cur=cls.memberIds.length;
  if(cur<cls.minMembers){toast('최소 '+cls.minMembers+'명 필요 (현재 '+cur+'명)','err');return;}
  if(cur>cls.maxMembers){toast('최대 인원('+cls.maxMembers+'명) 초과','err');return;}
  var startDt=today();
  cls.status='active';cls.startDate=startDt;
  // 소속 회원 전체 startDate 갱신 + 결제 요청 생성
  var fee=grpFee();
  cls.memberIds.forEach(function(mid){
    var m=memberById(mid);if(!m)return;
    m.startDate=startDt;
    m.expires=addMonths(startDt,m.termMonths>1?m.termMonths:1);
    m.remain=m.sessPerMonth||8;
    // 결제 요청 생성 (paid:false)
    var cObj=S.coaches.find(function(co){return co.name===m.coach;});
    var per=m.memberType==='term'?(m.termMonths===3?'3month':m.termMonths===6?'6month':'year'):'month';
    var perM={month:1,'3month':3,'6month':6,year:12}[per]||1;
    S.pays.push({id:'pay'+Date.now()+mid,memberId:mid,memberName:m.name,
      coachName:m.coach,coachId:cObj?cObj.id:'',type:'group',
      amt:fee*perM,requestDate:startDt,date:startDt,period:per,
      startDate:startDt,endDate:m.expires,
      meth:'계좌이체',settled:false,settleId:null,cancelled:false,paid:false,paidDate:null,
      note:cls.name+' 수업시작'});
  });
  // 이번 달 그룹 일정 자동 생성 (dow 기준)
  if(cls.dow&&cls.dow.length){
    var now_=new Date(startDt),y_=now_.getFullYear(),mo_=now_.getMonth();
    var gid_='g'+clsId+'_'+y_+S2(mo_+1);
    for(var d_=new Date(startDt);d_.getMonth()===mo_;d_.setDate(d_.getDate()+1)){
      if(cls.dow.indexOf(d_.getDay())>=0){
        var ds_=d_.getFullYear()+'-'+S2(d_.getMonth()+1)+'-'+S2(d_.getDate());
        if(ds_>=startDt){
          S.events.push({id:'ev'+Date.now()+Math.random().toString(36).slice(2,4),
            date:ds_,type:'group',coach:cls.coachName,coachId:cls.coachId,
            time:cls.time,label:cls.name,groupId:gid_,classId:clsId});
        }
      }
    }
  }
  save();toast('✅ '+cls.name+' 수업 시작! '+cur+'명 결제 요청 생성됨','ok');
  renderClassList();updDots();renderPay&&renderPay();
}

function doSaveMember(){
  var editId=($_('mb-edit-id')||{value:''}).value;

  var spm=tp==='group'?8:4;

  if(editId){
    var m=memberById(editId);if(!m)return;

      var unsettledPays2=S.pays.filter(function(p){return p.memberId===m.id&&!p.settled&&!p.cancelled;});
      if(unsettledPays2.length){
        // 코치 변경 경고 (토스트로)
      toast('⚠ 코치 변경: 미정산 결제 '+unsettledPays2.length+'건은 이전 코치 기준 정산됩니다','err');
      }
    }
    m.name=nm;m.type=tp;m.coach=co;m.memberType=mtype;m.termMonths=tmonths;
    m.startDate=st;m.expires=exp;m.sessPerMonth=spm;

    closeM('m-mb');save();toast('✅ 수정됨','ok');
    if($_('ap-more')&&$_('ap-more').classList.contains('on'))renderMemberList();
    return;
  }
  var cols=[['#DBEAFE','#1D4ED8'],['#FCE7F3','#9D174D'],['#D1FAE5','#065F46'],['#FEF3C7','#92400E'],['#EDE9FE','#5B21B6'],['#CCFBF1','#0F766E'],['#FFF1F2','#BE123C'],['#FFF7ED','#9A3412'],['#F0FDF4','#15803D'],['#E0E7FF','#3730A3']];
  var col=cols[S.members.length%cols.length];
  var tel=($_('mb-tel')||{value:''}).value;
  var born=parseInt(($_('mb-born')||{value:''}).value)||0;
  var member={id:'mb'+Date.now(),name:nm,pw:pw||'0000',type:tp,coach:co,memberType:mtype,termMonths:tmonths,startDate:st,expires:exp,remain:spm,sessPerMonth:spm,suspended:false,bg:col[0],tc:col[1],tel:tel,born:born,totalRemain:spm};
  S.members.push(member);
  // 그룹 회원: 반에 연결
  if(tp==='group'){
    var selCls=($_('mb-cls')||{value:''}).value;
    if(!selCls||selCls===''){
      // 반 선택 없음 → 즉시 등록 (기존 방식: 결제 자동 생성)
      // 아무것도 안 함, 아래 결제 자동생성 로직으로 계속
    } else
    if(selCls&&selCls!=='__new__'){
      var clsObj=S.classes.find(function(c){return c.id===selCls;});
      if(clsObj){
        member.classId=selCls;member.className=clsObj.name;
        if(clsObj.memberIds.indexOf(member.id)<0)clsObj.memberIds.push(member.id);

          toast('✅ '+nm+' 등록 — 그룹반 대기중 ('+clsObj.memberIds.length+'/'+clsObj.minMembers+'명)','ok');

        member.startDate=clsObj.startDate||st;
        member.expires=addMonths(member.startDate,member.memberType==='term'?member.termMonths:1);
      }
    }
  }
  // 회원 등록 시 첫 달 결제 요청 자동 생성 (paid:false = 입금대기)
  var coach_r=S.coaches.find(function(co){return co.name===co;});

    meth:'계좌이체',settled:false,settleId:null,cancelled:false,paid:false,
    note:'회원등록 자동생성',requestDate:st,paidDate:null};
  S.pays.push(initPay);
  closeM('m-mb');save();
  var msg=mtype==='term'?'기간제 '+tmonths+'개월 ('+st+' ~ '+exp+')':'월회원 ('+st+' 시작)';
  toast('✅ '+nm+' 등록 — 결제 요청 자동 생성됨','ok');
  renderAtt();updDots();

function confirmPay(pid){
  var p=S.pays.find(function(x){return x.id===pid;});if(!p)return;
  p.paid=true;
  p.paidDate=today(); // 실제 결제 확인일 = 결제일

  var m=memberById(p.memberId);
  if(m){
    // 결제 확인 시 만료일 갱신
    var perMonths={month:1,'3month':3,'6month':6,year:12}[p.period]||1;

function cancelPay(pid){
  var p=S.pays.find(function(x){return x.id===pid;});if(!p)return;
  var msg=p.memberName+' — '+fmt(p.amt)+'원\n'+p.startDate+' ~ '+p.endDate;

function cancelSettle(sid){

function delSettle(sid){

function renewMember(mid){
  var m=memberById(mid);if(!m)return;
  var fee=m.type==='group'?grpFee():perFee();
  var per=m.memberType==='term'?(m.termMonths===3?'3month':m.termMonths===6?'6month':'year'):'month';
  var perMonths={month:1,'3month':3,'6month':6,year:12}[per]||1;
  var newStart=addMonths(m.expires,0).slice(0,8)+'01'; // 다음달 1일 (간단 처리)
  // 만료일 다음날부터 시작
  var startDate=m.expires;
  var d=new Date(startDate);d.setDate(d.getDate()+1);
  startDate=d.getFullYear()+'-'+S2(d.getMonth()+1)+'-'+S2(d.getDate());
  var endDate=addMonths(startDate,perMonths);
  var coachObj=S.coaches.find(function(co){return co.name===m.coach;});
  var renewPay={id:'pay'+Date.now()+'_renew',memberId:m.id,memberName:m.name,
    coachName:m.coach,coachId:coachObj?coachObj.id:'',type:m.type,
    amt:fee*perMonths,requestDate:today(),date:today(),period:per,startDate:startDate,endDate:endDate,
    meth:'계좌이체',settled:false,settleId:null,cancelled:false,paid:false,paidDate:null,
    note:'연장 자동생성'};
  S.pays.push(renewPay);
  save();toast('✅ '+m.name+' 연장 결제 요청 생성 (입금 대기)','ok');
  renderMemberList();renderPay&&renderPay();
}

function delMember(mid){
  var m=memberById(mid);if(!m)return;
  // 대기중 반 회원 여부 확인
  var myCls2=m.classId?S.classes.find(function(c){return c.id===m.classId;}):null;
  var isWaiting2=myCls2&&myCls2.status==='waiting';

  if(isWaiting2){
    // 대기중 회원: 조건 없이 삭제 가능 (결제/일정 없음)
    showConfirm('회원 삭제',m.name+' 회원(대기중)을 삭제하시겠습니까?\n그룹반 대기 목록에서도 제거됩니다.','삭제','rd',function(){
      // 그룹반 memberIds에서 제거
      if(myCls2)myCls2.memberIds=myCls2.memberIds.filter(function(id){return id!==mid;});
      S.members=S.members.filter(function(x){return x.id!==mid;});
      save();toast(m.name+' 삭제됨','ok');renderMemberList();renderClassList&&renderClassList();updDots();
    });
    return;
  }

  // 일반 삭제 조건 체크
  var issues=[];
  var activeMks=S.makeups.filter(function(mk){return mk.memberId===mid&&!mk.usedDate;});
  // 미정산 + 확인완료(paid:true)인 건만 문제 (paid:false = 미확인 요청은 자동 취소)
  var settledPays=S.pays.filter(function(p){return p.memberId===mid&&!p.cancelled&&p.settled;});
  var confirmedPays=S.pays.filter(function(p){return p.memberId===mid&&!p.cancelled&&p.paid&&!p.settled&&p.endDate>=today();});
  if(activeMks.length)issues.push('미사용 보강권 '+activeMks.length+'장 (삭제 또는 소진 필요)');
  if(settledPays.length)issues.push('정산완료 결제 '+settledPays.length+'건 (이력 보존 필요)');
  if(confirmedPays.length)issues.push('유효 기간 결제 '+confirmedPays.length+'건 (기간 만료 후 삭제)');
  if(issues.length){
    showConfirm('삭제 불가','⚠ '+m.name+' 회원은 아직 삭제할 수 없습니다.\n\n· '+issues.join('\n· '),'확인','gy',function(){});
    return;
  }
  showConfirm('회원 삭제',m.name+' 회원을 삭제하시겠습니까?\n모든 이력(출결, 결제)이 함께 삭제됩니다.','삭제','rd',function(){
    // 그룹반 memberIds에서 제거
    if(m.classId){var cls2=S.classes.find(function(c){return c.id===m.classId;});if(cls2)cls2.memberIds=cls2.memberIds.filter(function(id){return id!==mid;});}
    S.members=S.members.filter(function(x){return x.id!==mid;});
    S.makeups=S.makeups.filter(function(x){return x.memberId!==mid;});
    S.pays=S.pays.filter(function(x){return x.memberId!==mid;});
    save();toast(m.name+' 삭제됨','ok');
    // 더보기 하위에서 삭제한 경우 목록 갱신
    if(typeof renderMemberList==='function')renderMemberList();updDots();
  });
}

function delMk(mkid){
  var mk=S.makeups.find(function(x){return x.id===mkid;});if(!mk)return;
  showConfirm('보강권 삭제',mk.memberName+' — '+mk.reason+'\n이 보강권을 삭제하시겠습니까?','삭제','rd',function(){

    save();toast('삭제됨','ok');renderMkSection();updDots();
  });
}
function extendMk(mkid){
  var mk=S.makeups.find(function(x){return x.id===mkid;});if(!mk)return;
  var origExp=mk.expires;
  var cur=mk.expires?new Date(mk.expires):new Date();
  cur.setMonth(cur.getMonth()+1);cur.setDate(0);
  mk.expires=cur.toISOString().slice(0,10);
  mk._prevExpires=origExp; // 연장 취소를 위해 저장
  save();toast(mk.memberName+' 1개월 연장 ('+mk.expires+')','ok');renderMkSection();
}
function cancelExtendMk(mkid){
  var mk=S.makeups.find(function(x){return x.id===mkid;});if(!mk||!mk._prevExpires)return;
  showConfirm('연장 취소','보강권 만료일을 되돌리시겠습니까?\n'+mk.expires+' → '+mk._prevExpires,'취소','am',function(){
    mk.expires=mk._prevExpires;delete mk._prevExpires;
    save();toast('연장 취소됨','ok');renderMkSection();
  });
}
function expireMk(){
  var now=todayObj();var cnt=0;
  S.makeups.forEach(function(mk){if(!mk.usedDate&&mk.expires&&new Date(mk.expires)<now){mk.usedDate='expired';cnt++;}});
  save();toast(cnt+'장 만료 처리','ok');renderMkSection();updDots();
}

function doSaveCoach(){
  var editId=($_('coach-edit-id')||{value:''}).value;
  var nm=($_('coach-nm')||{value:''}).value.trim();if(!nm){toast('이름을 입력하세요','err');return;}

  var acc=($_('coach-acc')||{value:''}).value;
  var gr=parseInt(($_('coach-gr')||{value:'35'}).value)||35;
  var pr=parseInt(($_('coach-pr')||{value:'40'}).value)||40;
  var pw=($_('coach-pw')||{value:''}).value;
  var cols=[['#DBEAFE','#1D4ED8'],['#FCE7F3','#9D174D'],['#D1FAE5','#065F46'],['#FEF3C7','#92400E']];
  if(editId){

    c.name=nm;c.phone=ph;c.account=acc;c.grpRate=gr;c.perRate=pr;

    closeM('m-coach');save();toast('✅ 수정됨','ok');renderCoachList();return;
  }
  var col=cols[S.coaches.length%cols.length];

}
function delCoach(cid){
  var c=S.coaches.find(function(x){return x.id===cid;});if(!c)return;
  var issues=[];
  var myMembers=S.members.filter(function(m){return m.coach===c.name&&!m.suspended;});
  var myEvs=S.events.filter(function(e){return e.coach===c.name&&e.date>=today();});
  var myMks=S.makeups.filter(function(mk){return !mk.usedDate&&myMembers.some(function(m){return m.id===mk.memberId;});});
  var myUnsettled=S.pays.filter(function(p){return p.coachId===cid&&!p.settled&&!p.cancelled;});
  if(myMembers.length)issues.push('담당 활성 회원 '+myMembers.length+'명');
  if(myEvs.length)issues.push('예정 레슨 일정 '+myEvs.length+'건');
  if(myMks.length)issues.push('미사용 보강권 '+myMks.length+'장');
  if(myUnsettled.length)issues.push('미정산 결제 '+myUnsettled.length+'건');
  if(issues.length){
    showConfirm('삭제 불가','⚠ '+c.name+' 코치는 아직 삭제할 수 없습니다.\n\n· '+issues.join('\n· '),'확인','gy',function(){});
    return;
  }
  showConfirm('코치 삭제',c.name+' 코치를 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.','삭제','rd',function(){
    S.coaches=S.coaches.filter(function(x){return x.id!==cid;});
    save();toast(c.name+' 삭제됨','ok');renderCoachList();
  });
}

    h+='<div class="row" style="overflow:hidden">'      +'<div class="av av-s" style="background:'+m.bg+';color:'+m.tc+';flex-shrink:0">'+m.name[0]+'</div>'      +'<div class="ri"><div class="rn">'+m.name+(mkCnt?' <span style="font-size:11px;color:#7B61FF">🎫'+mkCnt+'</span>':'')+'</div>'      +'<div class="rs">잔여 '+m.remain+'회'+(cur?' · '+lbs[cur]:'')+'</div></div>'      +'<div style="display:flex;gap:3px;flex-shrink:0">'      +'<button class="ab '+(cur===1?'a1':'a0')+'" data-mid="'+m.id+'" data-evid="'+ev.id+'" data-v="1" onclick="doCAttBtnInline(this)">출석</button>'      +'<button class="ab '+(cur===2?'a2':'a0')+'" data-mid="'+m.id+'" data-evid="'+ev.id+'" data-v="2" onclick="doCAttBtnInline(this)">보강</button>'      +'<button class="ab '+(cur===3?'a3':'a0')+'" data-mid="'+m.id+'" data-evid="'+ev.id+'" data-v="3" onclick="doCAttBtnInline(this)">노쇼</button>'      +'<button class="ab '+(cur===4?'a4':'a0')+'" data-mid="'+m.id+'" data-evid="'+ev.id+'" data-v="4" onclick="doCAttBtnInline(this)" title="무료">무료</button>'      +'<button class="ab '+(hasMk?'a2':'a0')+'" style="font-size:13px" data-mid="'+m.id+'" onclick="giveMkC(this.dataset.mid)">🎫</button>'      +'</div></div>';

function doCAttBtnInline(btn){
  var mid=btn.dataset.mid,v=parseInt(btn.dataset.v),evId=btn.dataset.evid;
  var key=evId+'_'+mid,prev=S.att[key]||0,cur=prev===v?0:v;
  S.att[key]=cur;var m=memberById(mid);if(!m)return;
  if(cur===4){save();renderCAttSecInline(evId);return;}
  if((cur===1||cur===2||cur===3)&&prev===0&&m.remain<=0)toast(m.name+' 잔여 0','err');
  // 출석(1)/보강(2)/노쇼(3) → 잔여 -1 / 무료(4) → 없음
  // 보강(2): 잔여 -1 + 보강권 자동 발급
  var wasDeduct=(prev===1||prev===2||prev===3),isDeduct=(cur===1||cur===2||cur===3);
  if(wasDeduct&&!isDeduct){m.remain++;if(m.totalRemain!==undefined)m.totalRemain++;}
  if(!wasDeduct&&isDeduct&&m.remain>0){m.remain--;if(m.totalRemain!==undefined&&m.totalRemain>0)m.totalRemain--;}
  if(cur===2&&prev!==2){
    var exp2i=new Date(today());exp2i.setMonth(exp2i.getMonth()+1);exp2i.setDate(0);
    S.makeups.push({id:'mk'+Date.now()+mid,memberId:mid,memberName:m.name,
      createdDate:today(),expires:exp2i.toISOString().slice(0,10),
      reason:'보강(사전연락)',usedDate:null,noticeId:null});
    toast(m.name+' 보강 — 잔여-1, 보강권 발급','ok');
  }
  if(prev===2&&cur!==2){
    var todayMks2=S.makeups.filter(function(x){return x.memberId===mid&&x.createdDate===today()&&x.reason==='보강(사전연락)'&&!x.usedDate;});
    if(todayMks2.length){S.makeups=S.makeups.filter(function(x){return x.id!==todayMks2[0].id;});}
  }
  save();renderCAttSecInline(evId);updDots();
}

function cAllAttInline(evId){
  var ev=S.events.find(function(e){return e.id===evId;});if(!ev)return;
  var mems=ev.type==='group'?S.members.filter(function(m){return !m.suspended&&m.type==='group'&&m.coach===ev.coach;}):ev.memberId?[memberById(ev.memberId)].filter(Boolean):[];
  mems.forEach(function(m){var key=ev.id+'_'+m.id,prev=S.att[key]||0;if(prev!==1){S.att[key]=1;if(prev!==2&&m.remain>0)m.remain--;}});
  save();toast('전체 출석','ok');renderCAttSecInline(evId);
}

function renderCoachCalGrid(coachFilter){
  var c=S.cur;if(!c)return;
  var el=$_('coach-cal-inner');if(!el)return;
  var y=_cCalY,m=_cCalM;
  var fd=new Date(y,m,1).getDay(),ld=new Date(y,m+1,0).getDate(),pl=new Date(y,m,0).getDate();
  var td=today();
  // 코치 전용 필터: 전체 or 본인만
  var filterHtml='<div class="filter-tabs">'
    +'<button class="ftab '+(_cCalFilter!=='own'?'on':'')+'" onclick="setCCoachFilter(\'all\')">전체</button>'
    +'<button class="ftab '+(_cCalFilter==='own'?'on':'')+'" onclick="setCCoachFilter(\'own\')">내 일정만</button>'
    +'</div>';
  var h=filterHtml+'<div class="card"><div class="cal-hdr">'
    +'<button class="cal-nb" onclick="cCalPrev()">‹</button>'
    +'<span class="cal-mn">'+y+'년 '+(m+1)+'월</span>'
    +'<button class="cal-nb" onclick="cCalNext()">›</button>'
    +'</div><div class="cal-grid">';
  ['일','월','화','수','목','금','토'].forEach(function(d){h+='<div class="cal-dow">'+d+'</div>';});
  for(var i=0;i<fd;i++)h+='<div class="cal-day ot"><div class="dn">'+(pl-fd+1+i)+'</div></div>';
  for(var d=1;d<=ld;d++){
    var ds=y+'-'+S2(m+1)+'-'+S2(d),dow=new Date(y,m,d).getDay();
    var evs=S.events.filter(function(e){
      if(e.date!==ds)return false;
      if(_cCalFilter==='own')return e.coach===c.name;
      return true;
    });
    var hl=evs.some(function(e){return e.type==='group'||e.type==='personal';});
    var cls='cal-day'+(ds===td?' td':hl?' hl':'');
    h+='<div class="'+cls+'" data-date="'+ds+'" onclick="cDayClick(this.dataset.date)">';
    var nc='dn'+(ds===td?' tn':dow===0?' sn':dow===6?' sa':'');
    h+='<div class="'+nc+'">'+d+'</div>';
    evs.slice(0,3).forEach(function(ev){
      var cc=ev.type==='group'?'cc-g':ev.type==='personal'?'cc-p':ev.type==='rental'?'cc-r':'cc-o';
      var sn=(ev.type==='group'||ev.type==='personal')?calcSess(ev.id):0;
      var lbl=ev.label||(ev.type==='group'?'그룹':ev.type==='personal'?(ev.memberName||'개인'):(ev.org||ev.type==='off'?'휴강':'대관'));
      h+='<span class="cc '+cc+'">'+(ev.time?ev.time.slice(0,5)+' ':'')+lbl+(sn?'('+sn+')':'')+'</span>';
    });
    if(evs.length>3)h+='<span style="font-size:8px;color:var(--tx3)">+'+(evs.length-3)+'</span>';
    h+='</div>';
  }
  var rem=7-((fd+ld)%7);if(rem<7){for(var j=1;j<=rem;j++)h+='<div class="cal-day ot"><div class="dn">'+j+'</div></div>';}
  h+='</div></div>';
  el.innerHTML=h;
}

function giveMkC(mid){
  var m=memberById(mid);if(!m)return;
  var existing=S.makeups.find(function(mk){return mk.memberId===mid&&mk.reason==='사전연락'&&mk.createdDate===today()&&!mk.usedDate;});
  if(existing){
    S.makeups=S.makeups.filter(function(mk){return mk.id!==existing.id;});
    toast(m.name+' 보강권 취소됨');
  }else{
    var exp=new Date();exp.setMonth(exp.getMonth()+1);exp.setDate(0);
    S.makeups.push({id:'mk'+Date.now(),memberId:mid,memberName:m.name,createdDate:today(),expires:exp.toISOString().slice(0,10),reason:'사전연락',usedDate:null,noticeId:null});
    toast(m.name+' 보강권 발급','ok');
  }
  save();renderCAttSec();updDots();
}
function doCAttBtn(btn){
  var mid=btn.dataset.mid,v=parseInt(btn.dataset.v),evId=btn.dataset.evid;
  var key=evId+'_'+mid,prev=S.att[key]||0,cur=prev===v?0:v;
  S.att[key]=cur;var m=memberById(mid);if(!m)return;
  if(cur===4){save();renderCAttSec();updDots();return;}
  if(cur===2&&prev!==2){
    var mk=S.makeups.find(function(x){return x.memberId===mid&&!x.usedDate&&(!x.expires||new Date(x.expires)>=new Date(today()));});
    if(!mk){toast(m.name+' 보강권 없음','err');S.att[key]=prev;return;}
  }
  if((cur===1||cur===3)&&prev!==cur&&m.remain<=0)toast(m.name+' 잔여 0','err');
  var wasDeduct=(prev===1||prev===2||prev===3),isDeduct=(cur===1||cur===2||cur===3);
  if(wasDeduct&&!isDeduct){m.remain++;if(m.totalRemain!==undefined)m.totalRemain++;}
  if(!wasDeduct&&isDeduct&&m.remain>0){m.remain--;if(m.totalRemain!==undefined&&m.totalRemain>0)m.totalRemain--;}
  if(cur===2&&prev!==2){var exp2c2=new Date(today());exp2c2.setMonth(exp2c2.getMonth()+1);exp2c2.setDate(0);S.makeups.push({id:'mk'+Date.now()+mid,memberId:mid,memberName:m.name,createdDate:today(),expires:exp2c2.toISOString().slice(0,10),reason:'보강(사전연락)',usedDate:null,noticeId:null});toast(m.name+' 보강 — 잔여-1, 보강권 발급','ok');}
  if(prev===2&&cur!==2){var todayMks4=S.makeups.filter(function(x){return x.memberId===mid&&x.createdDate===today()&&x.reason==='보강(사전연락)'&&!x.usedDate;});if(todayMks4.length)S.makeups=S.makeups.filter(function(x){return x.id!==todayMks4[0].id;});}
  save();renderCAttSec();updDots();
}

function renderCSettle(){
  var el=$_('cp-settle');if(!el)return;

  var coach=S.coaches.find(function(x){return x.id===c.id;});if(!coach)return;
  // 회원별 결제 내역 기반 정산
  var myPays=S.pays.filter(function(p){return p.coachId===c.id&&!p.cancelled&&p.paid;});
  var myMembers=S.members.filter(function(m){return m.coach===c.name;});
  var totalC=myPays.reduce(function(a,p){return a+(p.amt||0);},0);
  var settledCGross=myPays.filter(function(p){return p.settled;}).reduce(function(a,p){return a+Math.round((p.amt||0)*(p.type==='group'?coach.grpRate:coach.perRate)/100);},0);var settledC=Math.round(settledCGross*0.912);
  var pendingPays=myPays.filter(function(p){return !p.settled;});
  var pendingCoach=pendingPays.reduce(function(a,p){return a+Math.round((p.amt||0)*(p.type==='group'?coach.grpRate:coach.perRate)/100);},0);
  var pendingTaxC=Math.round(pendingCoach*0.088);pendingCoach=pendingCoach-pendingTaxC;
  var h='<div class="settle-h">'
    +'<div style="font-size:12px;color:rgba(255,255,255,.7)">'+c.name+' 코치 · 정산 현황</div>'
    +'<div class="settle-v">'+fmt(pendingCoach)+'원</div>'
    +'<div class="settle-r"><span>정산 가능</span><span>누적 지급 '+fmt(settledC)+'원</span></div></div>';
  // 회원별 결제 현황
  h+='<div class="sec">회원별 결제 현황</div>';
  myMembers.forEach(function(m){

    h+='<div class="card"><div class="cb"><div class="ct">'+m.name+' <span class="bx '+(m.type==='group'?'bl':'pu')+'">'+(m.type==='group'?'그룹':'개인')+'</span></div>';

        +'<div class="detail-val">'+fmt(p.amt)+'원 × '+rate+'%<br><span style="color:'+(p.settled?'var(--gy)':'var(--am)')+'">'+fmt(myAmt)+'원 '+(p.settled?'정산완료':'미정산')+'</span></div></div>';
    });
    h+='</div></div>';
  });
  if(!myPays.length)h+='<div style="text-align:center;padding:20px;color:var(--tx2)">결제 내역 없음</div>';

        +'<span class="bx gn">완료</span></div>';

  }
  h+='<button class="btn gy W" style="margin-top:4px" onclick="openM(\'m-pw\')">🔑 비밀번호 변경</button>';

function openCEvModal(){
  var c=S.cur;if(!c)return;
  var perMembers=S.members.filter(function(m){return m.coach===c.name&&m.type==='personal'&&!m.suspended;});
  var memList=$_('cev-mem-list');
  if(memList){
    if(!perMembers.length){
      memList.innerHTML='<div style="color:var(--tx3);font-size:13px;padding:6px">담당 개인레슨 회원 없음</div>';
    }else{
      memList.innerHTML=perMembers.map(function(m){
        return '<label style="display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:14px;cursor:pointer">'          +'<input type="checkbox" value="'+m.id+'" style="width:16px;height:16px;cursor:pointer">'          +'<span style="font-weight:500">'+m.name+'</span></label>';
      }).join('');
    }
  }
  var dt=$_('cev-dt');if(dt)dt.value=today();
  // 개인레슨 회원 없으면 유형을 휴강으로 기본
  var tp=$_('cev-tp');
  if(tp&&!perMembers.length)tp.value='off';
  cevTpChg();openM('m-cev');
}
function cevTpChg(){
  var v=($_('cev-tp')||{value:'personal'}).value;
  var pr=$_('cev-per-row'),of=$_('cev-off-row');
  if(pr)pr.style.display=v==='personal'?'block':'none';
  if(of)of.style.display=v==='off'?'block':'none';
}
function doCEvAdd(){
  var c=S.cur;if(!c)return;
  var dt=($_('cev-dt')||{value:''}).value;if(!dt){toast('날짜를 선택하세요','err');return;}
  var tp=($_('cev-tp')||{value:'personal'}).value;
  var evTime=($_('cev-tm')||{value:''}).value;
  if(tp==='personal'){
    // 체크된 회원 모두 개별 이벤트 생성
    var checks=document.querySelectorAll('#cev-mem-list input[type=checkbox]:checked');
    if(!checks||!checks.length){toast('이용자를 한 명 이상 선택하세요','err');return;}
    var cnt=0;
    checks.forEach(function(cb){
      var mid=cb.value;var m=memberById(mid);if(!m)return;
      S.events.push({id:'ev'+Date.now()+mid,date:dt,type:'personal',coach:c.name,
        coachId:c.id,memberId:mid,memberName:m.name,time:evTime});
      cnt++;
    });
    closeM('m-cev');save();toast('✅ 개인레슨 '+cnt+'건 추가됨','ok');renderCToday();
  }else{
    var ev={id:'ev'+Date.now(),date:dt,type:tp,coach:c.name,reason:($_('cev-rs')||{value:''}).value};
    S.events.push(ev);closeM('m-cev');save();toast('✅ 일정 추가됨','ok');renderCToday();
  }
}

function renderUHome(){

  h+='<button class="btn gy W" style="margin-bottom:8px" onclick="openM(\'m-pw\')">🔑 비밀번호 변경</button>';
  el.innerHTML=h;
}
function openUMk(){
  var m=memberById(S.cur.id);if(!m)return;
  var mks=myMakeups(m.id);
  var t=$_('m-mk-d-title');if(t)t.innerHTML='내 보강권 <button class="m-x" onclick="closeM(\'m-mk-detail\')">×</button>';
  var b=$_('m-mk-d-body');if(!b)return;
  if(!mks.length){b.innerHTML='<div style="text-align:center;padding:20px;color:var(--tx2)">보강권이 없습니다</div>';openM('m-mk-detail');return;}
  b.innerHTML=mks.map(function(mk){
    var dl=mk.expires?daysUntil(mk.expires):99;
    return '<div class="row"><span style="font-size:26px">🎫</span><div class="ri"><div class="rn">'+mk.reason+'</div><div class="rs">만료: '+(mk.expires?mk.expires.slice(5).replace('-','/'):'—')+(dl<=7?' <span style="color:var(--rd)">D-'+dl+'</span>':'')+'</div></div></div>';
  }).join('');
  b.innerHTML+='<div class="ib am" style="margin-top:10px">당월 소진 원칙 · 이월 불가<br>보강 일정은 코치에게 직접 문의하세요</div>';
  openM('m-mk-detail');
}
function renderUNotice(){
  var el=$_('up-notice');if(!el)return;
  var uid=S.cur.id;
  var h='';
  var sortedNotices=S.notices.slice().sort(function(a,b){return a.date>b.date?-1:1;});
  if(!sortedNotices.length)h='<div style="text-align:center;padding:40px;color:var(--tx2)">공지 없음</div>';
  sortedNotices.forEach(function(n){
    var isRead=n.read[uid];
    var tc={gen:'bl',off:'rd',pay:'am'}[n.type]||'gy';
    var tl={gen:'공지',off:'휴강',pay:'납부'}[n.type]||'공지';
    h+='<div class="row" style="cursor:pointer;align-items:flex-start" data-nid="'+n.id+'" onclick="openNotice(this.dataset.nid)">'
      +'<div style="flex:1"><span class="bx '+tc+'">'+tl+'</span>'
      +'<div style="font-size:14px;font-weight:'+(isRead?'500':'700')+';margin-top:4px">'+n.title+'</div>'
      +'<div style="font-size:12px;color:var(--tx2);margin-top:2px">'+n.date+'</div></div>'
      +(!isRead?'<div style="width:8px;height:8px;background:var(--bl);border-radius:50%;margin-top:6px;flex-shrink:0"></div>':'')+'</div>';
  });
  el.innerHTML=h;
}
function openNotice(nid){
  var n=S.notices.find(function(x){return x.id===nid;});if(!n)return;
  var uid=S.cur.id;n.read[uid]=true;save();
  var t=$_('m-nd-t');if(t)t.innerHTML=n.title+' <button class="m-x" onclick="closeM(\'m-nd\')">×</button>';
  var b=$_('m-nd-b');if(b)b.textContent=n.body;
  openM('m-nd');renderUNotice();updDots();
}

// ══ 비밀번호 ══
function openAdminSetting(){
  var el=$_('ap-more');if(!el)return;
  var h='<div class="sec" style="margin-top:0">⚙️ 시스템 설정</div>';
  h+='<div class="card"><div class="cb"><div class="ct">관리자 정보</div>';
  h+='<div class="f"><label>관리자 이름</label><input id="set-nm" class="fi" value="'+(S.admin.name||'')+'" placeholder="관리자 이름"></div>';
  h+='<div class="f"><label>입금 계좌번호</label><input id="set-acc" class="fi" value="'+(S.admin.account||'')+'" placeholder="은행명 000-0000-0000 (예금주)"></div>';
  h+='<div class="f-row">'    +'<div class="f"><label>그룹레슨 기본 단가 (만원)</label><input id="set-fg" type="number" class="fi" value="'+(S.admin.feeGroup||17)+'" placeholder="17"></div>'    +'<div class="f"><label>개인레슨 기본 단가 (만원)</label><input id="set-fp" type="number" class="fi" value="'+(S.admin.feePersonal||40)+'" placeholder="40"></div>'    +'</div>';
  h+='<div class="ib bl" style="margin-bottom:14px">💡 결제 등록 시 자동 입력되는 기본값 — 건별로 수정 가능</div>';
  h+='<div class="f"><label>새 비밀번호</label><input id="set-pw" type="password" class="fi" placeholder="변경할 경우만 입력"></div>';
  h+='<button class="btn bl W" onclick="saveAdminSetting()">저장</button>';
  h+='</div></div>';
  h+=backBtn();
  el.innerHTML=h;
}
function saveAdminSetting(){
  var nm=($_('set-nm')||{value:''}).value.trim();
  var acc=($_('set-acc')||{value:''}).value.trim();
  var pw=($_('set-pw')||{value:''}).value;
  var fg=parseInt(($_('set-fg')||{value:17}).value)||17;
  var fp=parseInt(($_('set-fp')||{value:40}).value)||40;
  if(nm)S.admin.name=nm;
  if(acc)S.admin.account=acc;
  S.admin.feeGroup=fg;
  S.admin.feePersonal=fp;
  if(pw){if(pw.length<4){toast('비밀번호 4자리 이상','err');return;}S.admin.pw=pw;}
  save();toast('✅ 설정 저장됨 (그룹 '+fg+'만 / 개인 '+fp+'만)','ok');renderMore();
}

function doReset(){
  // showConfirm 대신 두 번 확인
  if(!window.confirm('⚠ 모든 데이터를 초기화합니까?\n이 작업은 되돌릴 수 없습니다.'))return;
  if(!window.confirm('정말 초기화합니까? 데이터가 전부 삭제됩니다.'))return;
  localStorage.removeItem('cpv2');
  // S 완전 초기화
  S.members=[];S.events=[];S.att={};S.pays=[];
  S.settles=[];S.notices=[];S.makeups=[];
  S.coaches=[];S.admin={pw:'',name:'관리자'};
  save();
  toast('초기화 완료','ok');
  renderMore();
}

function doChangePw(){
  var old=($_('pw-o')||{value:''}).value,n1=($_('pw-n1')||{value:''}).value,n2=($_('pw-n2')||{value:''}).value;
  if(!S.cur)return;
  if(old!==S.cur.pw){toast('현재 비밀번호가 틀립니다','err');return;}
  if(n1!==n2){toast('새 비밀번호가 일치하지 않습니다','err');return;}
  if(n1.length<4){toast('4자리 이상 입력하세요','err');return;}
  S.cur.pw=n1;
  if(S.cur.role==='user'){var m=memberById(S.cur.id);if(m)m.pw=n1;}
  else if(S.cur.role==='coach'){var co=S.coaches.find(function(x){return x.id===S.cur.id;});if(co)co.pw=n1;}
  else S.admin.pw=n1;
  save();closeM('m-pw');toast('비밀번호 변경됨','ok');
}

document.addEventListener('DOMContentLoaded',function(){
  // Supabase 설정된 경우 클라우드에서 먼저 로드
  load(); // localStorage 항상 먼저 로드
  if(SUPABASE_URL&&SUPABASE_KEY){
    loadFromSupabase(function(){renderLgFields();}); // Supabase로 덮어쓰기
  }else{
    renderLgFields();
  }
  document.querySelectorAll('.dim').forEach(function(bg){
    bg.addEventListener('click',function(e){if(e.target===bg)bg.classList.remove('open');});
  });
});
</script>
