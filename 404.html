<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>KEEP | 잠시 점검 중이에요</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    height:100%;
    font-family:'Noto Sans KR',Apple SD Gothic Neo,sans-serif;
    background:#FAFAFA;
    color:#1A1A18;
  }
  .wrap{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
    text-align:center;
  }
  .logo{
    width:120px;
    height:auto;
    margin-bottom:32px;
  }
  .icon{
    font-size:52px;
    margin-bottom:20px;
    animation:bounce 1.6s ease-in-out infinite;
  }
  .title{
    font-size:20px;
    font-weight:700;
    color:#1A1A18;
    margin-bottom:10px;
    letter-spacing:-.02em;
  }
  .desc{
    font-size:14px;
    color:#888;
    line-height:1.8;
    margin-bottom:32px;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#E8F5EE;
    color:#0F6E56;
    font-size:12px;
    font-weight:700;
    padding:6px 14px;
    border-radius:20px;
    margin-bottom:32px;
  }
  .dot{
    width:7px;height:7px;
    border-radius:50%;
    background:#1A6B3C;
    animation:pulse 1.2s ease-in-out infinite;
  }
  .btn{
    display:inline-block;
    background:#1A6B3C;
    color:#fff;
    font-size:14px;
    font-weight:700;
    padding:13px 28px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    text-decoration:none;
    font-family:inherit;
    transition:opacity .15s;
  }
  .btn:active{opacity:.8}
  .footer{
    margin-top:40px;
    font-size:11px;
    color:#bbb;
  }
  @keyframes bounce{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.4;transform:scale(.7)}
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
</head>
